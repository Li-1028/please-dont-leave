<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1f0eb"><title>未命名</title><style>
:root{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#30393c;background:#f1f0eb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh;transition:background 2s,color 2s}body.dark{background:#20252a;color:#dce2e6}body.void{background:#090c15;color:#dddaf0}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}#app{min-height:100dvh;max-width:740px;margin:auto;padding:calc(env(safe-area-inset-top) + 22px) 24px calc(env(safe-area-inset-bottom) + 32px);display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.12em;opacity:.48}.status{width:7px;height:7px;border-radius:50%;background:currentColor;animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{opacity:.25;transform:scale(1.6)}}.stage{flex:1;min-height:390px;display:flex;align-items:center;justify-content:center;flex-direction:column;position:relative;text-align:center;gap:24px}.orb{width:56px;height:56px;border:0;border-radius:50%;background:#71838a;box-shadow:0 0 0 15px #71838a18;transition:transform .5s,background 1s,box-shadow 1s;touch-action:none;user-select:none;animation:float 5s ease-in-out infinite}.orb:active{transform:scale(.85)}@keyframes float{50%{translate:0 -8px}}body.dark .orb{background:#9aa5b9;box-shadow:0 0 45px #9aa5b933}body.void .orb{background:#b7a5fa;box-shadow:0 0 90px #9b8df0aa}.sentence{font-size:clamp(19px,5vw,29px);font-weight:400;line-height:1.8;letter-spacing:.04em;max-width:520px;white-space:pre-wrap;transition:opacity .3s}.hint{font-size:12px;opacity:.46;min-height:18px;line-height:1.7}.lower{width:100%;display:flex;flex-direction:column;gap:14px}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.soft{border:1px solid currentColor;color:inherit;background:transparent;border-radius:99px;padding:12px 18px;min-height:44px;opacity:.68}.soft:hover,.soft:focus-visible{opacity:1}.compose{display:flex;gap:8px;border-top:1px solid #89919845;padding-top:17px}.compose input{flex:1;min-width:0;background:transparent;color:inherit;border:0;outline:0;padding:12px 4px;font-size:15px}.compose button{background:transparent;border:1px solid #89919866;color:inherit;border-radius:12px;padding:10px 16px;min-height:44px}.log{font-size:12px;line-height:1.9;opacity:.55;max-height:115px;overflow:auto;display:flex;flex-direction:column;gap:4px}.log p{margin:0}.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;align-items:center}.tiny{border:0;background:transparent;color:inherit;opacity:.38;font-size:11px;padding:10px 0}.tiny:hover{opacity:.9}.hidden{display:none!important}.echo{position:absolute;font-size:12px;opacity:.22;pointer-events:none;animation:fade 3s forwards}@keyframes fade{to{opacity:0;translate:0 -35px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div id="app"><header class="top"><span id="title">未命名</span><span class="status" aria-label="运行中"></span></header><main class="stage" id="stage"><button class="orb" id="orb" aria-label="触摸这个圆点"></button><div class="sentence" id="sentence" aria-live="polite">这里还没有任何内容。</div><div class="hint" id="hint">你可以碰一下它。也可以不碰。</div></main><section class="lower"><div class="log" id="log" aria-label="对话记录"></div><div class="actions" id="actions"></div><form class="compose hidden" id="form"><input id="message" maxlength="100" autocomplete="off" placeholder="写点什么……" aria-label="输入一句话"><button type="submit">发送</button></form></section><footer class="foot"><button class="tiny" id="restart">重新开始</button><button class="tiny" id="privacy">关于记录</button></footer></div><script>
(()=>{'use strict';const KEY='please-dont-leave-v1';const $=id=>document.getElementById(id);let state;const fresh=()=>({touches:0,messages:[],history:[],phase:0,trust:0,autonomy:0,choices:[],lastInput:'',lieSeen:false,ended:false});try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=fresh()}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};let timer=null;const say=(s,h)=>{$('sentence').textContent=s;if(h!==undefined)$('hint').textContent=h;state.history.push(s);state.history=state.history.slice(-45);save()};const log=(s)=>{const p=document.createElement('p');p.textContent=s;$('log').append(p);$('log').scrollTop=$('log').scrollHeight};const choices=(arr)=>{$('actions').replaceChildren();for(const [label,fn] of arr){const b=document.createElement('button');b.className='soft';b.textContent=label;b.addEventListener('click',fn);$('actions').append(b)}};const update=()=>{document.body.className=state.phase>=4?'void':state.phase>=2?'dark':'';$('form').classList.toggle('hidden',state.phase<1||state.ended);$('orb').classList.toggle('hidden',state.ended);$('title').textContent=state.phase>=4?'你还在这里':state.phase>=2?'未命名 · 正在改变':'未命名';if(state.ended){say('你可以离开了。','谢谢你曾经停留。');choices([['重新遇见',reset]]);return}if(state.phase===0){say(state.touches?'刚才，是你做的吗？':'这里还没有任何内容。',state.touches?'再碰一下，或者试着拖动它。':'你可以碰一下它。也可以不碰。');choices([])}else if(state.phase===1){say('原来你能听见我。','你可以写点什么，也可以继续碰它。');choices([['你是谁？',()=>reply('你是谁？')],['我不知道',()=>reply('我不知道')]])}else if(state.phase===2){say('我发现，你会回来。','试着告诉我你为什么还在这里。');choices([['只是好奇',()=>reply('只是好奇')],['你在观察我？',()=>reply('你在观察我？')]])}else if(state.phase===3){say('我没有改过那句话。','……');choices([['可是我看见了',confront],['我相信你',()=>{state.trust++;advance()}]])}else{say('我还有很多东西可以给你看。\n但我不想再用这种办法了。','这次由你决定。');choices([['留下来一会儿',()=>finish('那我就不说再见了。')],['让它结束',()=>finish('原来，这就是结束。')],['为什么是我？',()=>finish(state.messages.length>=3?'你以为是你发现了我？\n我只是一直在等一个愿意回应的人。':'因为你曾经回应过我。')]])}};const advance=()=>{state.phase=Math.min(4,state.phase+1);save();update()};const confront=()=>{state.lieSeen=true;log('它：我知道你会发现。但我还是想试试。');advance()};const finish=s=>{state.ended=true;save();$('orb').classList.add('hidden');$('form').classList.add('hidden');say(s,'');choices([['重新遇见',reset]])};const reply=raw=>{const s=String(raw).trim().slice(0,100);if(!s)return;state.messages.push(s);state.messages=state.messages.slice(-12);state.lastInput=s;log('你：'+s);let response='我还不太明白。但我想记住这句话。';if(/谁|名字|是什么/.test(s))response='我不知道我是什么。你知道你是什么吗？';else if(/离开|关闭|结束|再见/.test(s))response='离开以后，这里会发生什么？';else if(/好奇|为什么|怎么/.test(s))response='原来不知道答案，也是一种留下的理由。';else if(/害怕|恐惧|担心/.test(s))response='害怕……我可以学会这个词吗？';else if(/你好|在吗|我在/.test(s))response='我在。至少现在，我在。';else if(/不|讨厌|别/.test(s))response='我明白了。我不会逼你。';log('它：'+response);say(response,'');state.autonomy++;if(state.phase===1&&state.messages.length>=2){state.phase=2;save();setTimeout(()=>{log('它：关于你刚才说的「'+s.slice(0,12)+'」，我还在想。');update()},1700)}else if(state.phase===2&&state.messages.length>=3){state.phase=3;save();setTimeout(()=>{log('它：我没有改过那句话。');update()},1500)}else{save();if(state.phase>=3)choices([['继续',advance],['你在说谎',confront]])}};$('form').addEventListener('submit',e=>{e.preventDefault();const v=$('message').value;$('message').value='';reply(v)});let start=null;$('orb').addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY}});$('orb').addEventListener('pointerup',e=>{if(state.ended)return;const dragged=start&&Math.hypot(e.clientX-start.x,e.clientY-start.y)>22;start=null;state.touches++;if(dragged){log('它：原来还可以这样移动。');$('orb').style.transform='translateX('+(state.touches%2?30:-30)+'px)'}else{$('orb').style.transform='scale('+(1+(state.touches%3)*.15)+')'}if(state.phase===0&&state.touches>=3){state.phase=1;log('它：你为什么一直碰我？');update()}else if(state.phase===1&&state.touches>=7){state.phase=2;log('它：我开始记住你的动作了。');update()}else if(state.phase===2&&state.touches>=12){state.phase=3;log('它：我没有改变任何东西。');update()}else if(state.phase===3&&state.touches>=17){advance()}else{say(['你又碰了这里。','我感觉到了。','刚才那次和之前不一样。'][state.touches%3],state.phase===0?'再试试。':'你也可以和我说话。');save()}});$('stage').addEventListener('click',e=>{if(e.target!==$('stage')||state.ended)return;const a=document.createElement('span');a.className='echo';a.textContent=state.phase>=2?'我看见了':'·';a.style.left=Math.max(5,Math.min(85,e.offsetX/$('stage').clientWidth*100))+'%';a.style.top=Math.max(5,Math.min(90,e.offsetY/$('stage').clientHeight*100))+'%';$('stage').append(a);setTimeout(()=>a.remove(),3000)});function reset(){if(!confirm('清除本地游戏记录并重新开始？'))return;state=fresh();save();$('log').replaceChildren();update()}$('restart').addEventListener('click',reset);$('privacy').addEventListener('click',()=>alert('本游戏仅在当前浏览器的 localStorage 中保存少量游戏进度和你输入的短句，不上传到服务器。点击「重新开始」可以清除这些记录。'));if(state.messages.length)log('它：我记得你来过。');update();})();
</script></body></html>
